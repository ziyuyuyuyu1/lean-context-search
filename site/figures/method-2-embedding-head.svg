  <title id="title">Two weighted cosine paths retrieve the top 200</title>
  <desc id="description">A frozen Qwen3-Embedding-8B encodes the query and all 310579 enriched corpus passages. Query and document vectors feed base cosine at weight 70 percent and a shared 128-dimensional head cosine at weight 30 percent. Their sum scores the full corpus and selects the top 200.</desc>
