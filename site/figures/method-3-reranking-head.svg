  <title id="title">Rerank enriched passages with the frozen Qwen margin</title>
  <desc id="description">The same 200 candidates from embedding retrieval enter frozen Qwen3-Reranker-8B with the query and enriched passages. The efficient yes-minus-no margin directly orders the candidates, with no added reranker head. The top 100 are returned from the same pool. Colored row motifs are schematic and do not encode measured example ranks. The historical figure filename is retained for link compatibility.</desc>
