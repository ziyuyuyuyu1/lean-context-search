<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" fill="#203248">
  <title id="title">Checked structure and cone containment</title>
  <desc id="description">Left: a real checked AddAction to AddSemigroupAction to VAdd supplier path. Right: an explicitly schematic Poincare cone; A supplies an inside result B while X is outside. The bottom reports the saved known-interface fit, not the schematic coordinates: 212 of 212 recorded positives inside and 212 of 212 strict reversals rejected. These checks concern known interfaces, not general search accuracy.</desc>
